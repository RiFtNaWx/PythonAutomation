# PCB / fixture board revisions by family + package.
# Label kinds are data-driven. Setup "Add labels" picks kind + value.
# Not a #Test_Database path axis. Not fixture gain modes (BUFFER/G11).

kinds:
  board:
    label: Board
  board_type:
    label: Board type
  tag:
    label: Tag
  task:
    label: Task

families:
  opamp:
    TTSOP8:
      - G11-REV2
      - G11-REV3
      - BUFFER-REV1
      - G_NEG100-REV1
      - VOS-G201-REV1
    DIP8:
      - BUFFER-DIP-REV1
      - G11-DIP-REV1
    default:
      - G11-REV3
      - BUFFER-REV1
    board_types:
      - G11
      - BUFFER
      - G_NEG100
  logic:
    SOT23:
      - LOGIC-SOT23-REV1
      - LOGIC-SOT23-REV2
    SOIC:
      - LOGIC-SOIC-REV1
    TSSOP14:
      - LOGIC-TSSOP14-REV1
    default:
      - LOGIC-GENERIC-REV1
    board_types:
      - Logic
  switch:
    MSOP:
      - SWITCH-MSOP-REV1
    UQFN:
      - SWITCH-UQFN-REV1
    "UQFN1.4X1.8-10":
      - SWITCH-UQFN-REV1
    default:
      - SWITCH-GENERIC-REV1
    board_types:
      - AnalogSwitch
  level:
    TSSOP14:
      - LEVEL-TSSOP14-REV1
    default:
      - LEVEL-GENERIC-REV1
    board_types:
      - LevelShifter
  power:
    SOT23-5:
      - LDO-SOT23-REV1
    ESOP8:
      - LDO-ESOP8-REV1
    default:
      - LDO-GENERIC-REV1
    board_types:
      - LDO
