  extract: ate/config/datasheets/text/rs0204.txt
  notes: Hand-kept from extract table 8.3/8.4. Auto-guess has no dual-rail patterns.
test_info:
  icc:
    title: Combined supply current
    description: I_CCA + I_CCB Full max 10 uA (OE high, I_O=0).
  il:
    title: Partial power-down / Ioff
    description: A or B port Ioff Full max 2 uA.
  vol:
    title: Output low
    description: VOLA/VOLB Full max 0.4 V.
  voh:
    title: Output high
    description: VOHA = VCCA-0.4 V (1.4V to 3.6V Full). Condition-dependent; drop
      max 0.4 V.
  vih:
    title: Input high
    description: VIH min = 0.65 * VCCI (ratio, not a fixed volt).
