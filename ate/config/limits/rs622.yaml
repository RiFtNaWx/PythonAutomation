test_info:
  gbw:
    title: Gain bandwidth
    description: G11 board. Datasheet typical 7 MHz.
  vos_sweep:
    title: Input offset
    description: Datasheet Vos typical 0.7 mV, max 3 mV.
  slew:
    title: Slew rate
    description: BUFFER board. Fill SR min/max from the PDF electrical table.
  noise:
    title: 0.1-10 Hz voltage noise
    description: High-gain DUT, AC-couple VOUT, 1 s/div (~10 s window), measure Vpp,
      divide by |gain|. RS62X en is 11 nV/rtHz at 1 kHz and 7.5 nV/rtHz at 10 kHz
      (spectrum / FFT). This slot does not stamp those density numbers. No 0.1-10
      Hz min/max in the PDF, so VN_IN_PP_uV stays unspec until you type a limit.
