# RS2227 analog switch (DPDT USB). Owner Lim.
# USB Path B: usb_ron / usb_ton_toff / usb_iso / usb_xtalk.
# Do not enable RS2323 COM/NO/NC ids, iso, or xtalk.

part: RS2227
model: RS2227
component: AnalogSwitch
device: RS2227
package: MSOP
version: Version_1
sample_size: 4
year: "2026"
owner: seelim
part_key: rs2227
product_class: analog_switch

vcc: 5.0
current_limit: 0.10
bias_current_limit: 0.05
vcc_sweep: [1.8, 3.3, 5.0]
dmm_readings: 3
dmm_settle_s: 0.2
display_limit_ua: 1.0
ron_force_a: 0.01
timing:
  timeout_s: 120.0
  settle_s: 0.5

enabled_tests:
  - iplus
  - leakage_off
  - leakage_on
  - input_leakage
  - usb_ron
  - usb_ton_toff
  - usb_iso
  - usb_xtalk

fixture_modes:
  LIM_RS2323:
    label: "RS2227 USB DPDT analog switch"
    board_class: general
    checklist:
      - "USB DPDT: D+/D- and HSD1/HSD2. Not RS2323 COM/NO/NC."
      - "OE=GND to enable. S=GND -> HSD1; S=V+ -> HSD2. OE=V+ for IOZ Hi-Z."
      - "Iplus/leakage Continue names S/OE/HSD, not IN1/NO/COM."
      - "RON 10 mA platform. rON min/max still PDF image. tON/tOFF banner typ only."
      - "USB ISO/XTalk are 1 MHz high-Z. Not 50 ohm RF. Not 550 MHz BW."
    tests:
      - iplus
      - leakage_off
      - leakage_on
      - input_leakage
      - usb_ron
      - usb_ton_toff
      - usb_iso
      - usb_xtalk
