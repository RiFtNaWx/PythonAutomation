# RS29511 hot-swappable I2C / SMBus buffer (Soo). Not a 3-state CMOS gate.
# TEN/TDIS Path B: EN->READY (tIDLE / tDISABLE) in ate/tests/logic/oe_timing.py.
# TP/TIDLE Path B: SDAIN->SDAOUT in ate/tests/logic/rs29511_prop.py (wraps routes).
# ICC/READY/Cio Path B: ate/tests/logic/rs29511_dc.py (wraps routes). Not eugene CMOS IDD.
# Do not wrap Soo logic_tests.test_ten / test_tp (copied 3-state / level-shifter recipes).

part: RS29511
model: RS29511
component: Logic
device: RS29511
package: SOIC
version: Version_1
sample_size: 4
year: "2026"
owner: soo
part_key: rs29511

# Bench defaults (team-editable)
vcc: 5.0
current_limit: 0.10
htol_ns: 230
timing:
  timeout_s: 4.0
  settle_s: 0.3

# Run list filter — Soo set only (no Ariff DC extras)
enabled_tests:
  - tp
  - tidle
  - tdis
  - ten
  - supply_current
  - output_voltage
  - cap_load
gaps:
  - Path A (not Path B)

fixture_modes:
  LOGIC:
    label: "Logic board (RS29511 / Soo)"
    board_class: general
    checklist:
      - "I2C hot-swap buffer. EN high = connect after idle; EN low = isolate."
      - "TEN/TDIS: 10k pull-up READY + SDA/SCL to VCC. AWG CH1=EN; MSO CH1=EN CH2=READY."
      - "Not 3-state Y pull-down. TP/TIDLE Path B: EN=VCC jumper, AWG=SDA, MSO SDAIN/SDAOUT."
      - "DMM wraps leftover: IDD / VOUT / CapLoad still Soo logic_tests."
    tests:
      - tp
      - tidle
      - tdis
      - ten
      - supply_current
      - output_voltage
      - cap_load
